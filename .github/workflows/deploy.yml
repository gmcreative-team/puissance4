# .github/workflows/deploy.yml
name: Deploy Puissance4

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup PHP (pour composer si besoin)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install backend deps
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader
        if: hashFiles('backend/composer.json') != ''

      - name: Get runner's public IP
        id: ip
        uses: haythem/public-ip@v1.3

      - name: Whitelist runner IP on O2switch
        run: |
          curl -sm 45 -u "${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_PASSWORD }}" \
            "https://${{ secrets.CPANEL_SERVER }}:2083/execute/SshWhitelist/add?address=${{ steps.ip.outputs.ipv4 }}&port=22"

      - name: Deploy frontend via rsync/SSH
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          SOURCE: "frontend/dist/"
          TARGET: "${{ secrets.DEPLOY_PATH }}/"
          ARGS: "-avz --delete"

      - name: Deploy backend via rsync/SSH
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          SOURCE: "backend/"
          TARGET: "${{ secrets.DEPLOY_PATH }}/api/"
          ARGS: "-avz --delete --exclude='.env'"

      - name: Remove whitelisted IP after deploy
        if: always()
        run: |
          curl -sm 45 -u "${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_PASSWORD }}" \
            "https://${{ secrets.CPANEL_SERVER }}:2083/execute/SshWhitelist/remove_all"